name: verify

# Installs this plugin into a throwaway DSH profile and actually boots it —
# `dsh --profile <name> --dump-config` only merges the YAML bundle layers and
# never imports the referenced plugin JS, so it would not have caught the
# "declared dependency never gets resolved" class of bug this plugin hit
# during development. A real boot does: the loader dynamically imports
# index.js, which imports every other module in the tree.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install plugin dependencies
        run: npm install

      - name: Check generated cordis patch is current
        run: node scripts/build-cordis-patch.mjs --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the vendored PaperMemory package and its tests
        run: |
          python -m pip install --upgrade pip
          pip install -e "vendor/papermemory[pdf]" pytest scipy pillow defusedxml

      - name: Run the PaperMemory test suite
        run: python -m pytest -q vendor/papermemory/tests

      - name: Install TextFold for paper_fold integration
        run: python -m pip install 'textfold==0.10.31'

      - name: Run paper_fold live integration
        run: TEXTFOLD_LIVE_REQUIRED=1 TEXTFOLD_SKIP_INSTALL=1 TEXTFOLD_PYTHON="$(command -v python)" node scripts/test-paper-fold-live.mjs

      - name: Check the MCP tool surface and plugin guidance
        run: PM_CLI="$(command -v papermemory)" node scripts/test-phase7.mjs

      - name: Run search provider tests
        run: |
          node scripts/test-search-normalize.mjs
          node scripts/test-search-ratelimit.mjs
          node scripts/test-search-execute.mjs
          node scripts/test-domain-sources.mjs

      - name: Run non-search tool tests
        run: |
          node scripts/test-citation-format.mjs
          node scripts/test-manuscript-tools.mjs
          node scripts/test-review-store.mjs
          node scripts/test-review-tool.mjs
          node scripts/test-reporting-check.mjs
          node scripts/test-integrity.mjs
          node scripts/test-registries.mjs
          node scripts/test-optional-tools.mjs
          node scripts/test-audits.mjs
          node scripts/test-grants.mjs
          node scripts/test-nonsearch-tools.mjs
          node scripts/test-fold.mjs
          node scripts/test-reply-fold.mjs
          node scripts/test-paper-fold.mjs
          node scripts/test-compute.mjs
          node scripts/test-compute-http.mjs
          node scripts/test-mermaid-render.mjs

      - name: Check rename identity and migration
        run: |
          node scripts/test-rename.mjs
          node scripts/test-academic-harness.mjs
          node scripts/test-paper2agent.mjs

      - name: Rebuild the client bundle and check it's committed
        run: |
          npm run build
          if ! git diff --exit-code -- lib/; then
            echo "::error::lib/client.js is stale — run 'npm run build' and commit the result"
            exit 1
          fi

      # Pin the CLI to the same 0.2.1-rc.2 line as package.json dsh-* deps.
      # The 0.1.5-rc.2 pin plus a web-app override sent npm into a peer-
      # resolution loop that OOM'd the runner (~1h, exit 134).
      - name: Install the dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.2

      - name: Compose a throwaway profile that installs this plugin
        run: |
          mkdir -p /tmp/dsh-home/profiles/ci
          cat > /tmp/dsh-home/profiles/ci/package.json <<EOF
          {
            "name": "dsh-profile-ci",
            "private": true,
            "dependencies": {
              "academic-harness": "file:${{ github.workspace }}"
            },
            "dsh": {
              "profile": {
                "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "academic-harness"]
              }
            }
          }
          EOF
          printf '[]\n' > /tmp/dsh-home/profiles/ci/cordis.yml

      - name: Install profile dependencies
        working-directory: /tmp/dsh-home/profiles/ci
        run: npm install

      - name: Boot the profile and confirm it comes up clean
        env:
          DSH_HOME: /tmp/dsh-home
          TEXTFOLD_SKIP_INSTALL: '1'
          TEXTFOLD_PYTHON: python
        working-directory: /tmp/dsh-home/profiles/ci
        run: |
          timeout 90 dsh --profile ci --no-open > boot.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 40); do
            if grep -q "dsh web:" boot.log; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "----- boot.log -----"
          cat boot.log
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::dsh did not report a listening web server — see boot.log above"
            exit 1
          fi
          if grep -qiE 'failed to import|entry "agent-presets" not found|Unknown agent preset|Duplicate agent preset' boot.log; then
            echo "::error::dsh booted with plugin/preset errors — see boot.log above"
            exit 1
          fi
          echo "booted cleanly"
