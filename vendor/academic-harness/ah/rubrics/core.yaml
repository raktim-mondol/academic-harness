# Default criteria for any academic prose. Each asks about a DEFECT: "yes" means the problem is present, and the
# model must quote the words that show it. They ship unadmitted, so they report at info until the author measures
# them against hand labels (`ah rubric admit`). Omissions (a missing section, a missing statement) are profile rules.
criteria:
  - id: RUB-CAUSAL
    version: 1
    level: minor
    question: >-
      Does the paragraph state a causal relationship (for example "causes", "leads to", "drives", "results in") for
      something the paragraph itself presents only as a correlation, an association, or an observed co-occurrence?
  - id: RUB-GENERAL
    version: 3
    level: minor
    quote_pattern: '\b(always|never|every|everywhere|all|any|none|no|universal(?:ly)?|in all cases|completely|entirely|regardless|without exception|invariably|inherently)\b'
    question: >-
      A universal word is required, and you must quote it; reasoning that goes a little past the data ("suggests",
      "may", "likely") is not a defect. With that rule: does the paragraph use an explicit universal or unqualified
      word ("always", "never", "in all cases", "every", "all", "universally", "any", "none", "completely") about a
      result or method, when the evidence the paragraph itself describes covers only a limited set of cases?
  - id: RUB-SUPERLATIVE
    version: 3
    level: minor
    quote_pattern: '\b(first|only|best|most|state[- ]of[- ]the[- ]art|outperform\w*|unprecedented|superior|largest|highest|leading)\b'
    question: >-
      Quote the claim. Describing a need ("requires novel developments"), using "optimal" or "novel" as an ordinary
      technical adjective, or naming a ranking that the paragraph itself measures, is not a defect. With that rule:
      does the paragraph claim that this work, method or result is the first, the only, the best, the most (adopted,
      validated, accurate), state of the art, or better than all alternatives, without any comparison, citation or
      measurement in the same paragraph that backs the claim?
