 stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">A .bib, .ris or .json file, or pasted</tspan><tspan x="0" y="13.9">text</tspan></text></g><g class="pele-node pele-shape-rect" data-id="P" transform="translate(233.02,192)"><rect x="-101.64" y="-66" width="203.27" height="132" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-40.1">Read it tolerantly</tspan><tspan x="0" y="-22.1">macros, ( ) entries, quoted</tspan><tspan x="0" y="-4.1">values</tspan><tspan x="0" y="13.9">an entry missing its closing</tspan><tspan x="0" y="31.9">brace</tspan><tspan x="0" y="49.9">is reported and recovered</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N" transform="translate(233.02,345)"><rect x="-111.76" y="-39" width="223.53" height="78" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-13.1">Normalise to CSL-JSON</tspan><tspan x="0" y="4.9">every other field kept under its</tspan><tspan x="0" y="22.9">own name</tspan></text></g><g class="pele-node pele-shape-diam" data-id="I" transform="translate(233.02,515.28)"><polygon points="0,-83.28 133.26,0 0,83.28 -133.25,0" fill="#f3f3f3" stroke="#8a8a8a"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">Paper already stored?</tspan><tspan x="0" y="13.9">DOI, arXiv, PMID, title + year</tspan></text></g><g class="pele-node pele-shape-rect" data-id="NEW" transform="translate(162.54,691.07)"><rect x="-44.45" y="-22.5" width="88.91" height="45" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="0" y="4.9" text-anchor="middle">Create it</text></g><g class="pele-node pele-shape-rect" data-id="SAME" transform="translate(303.5,691.07)"><rect x="-56.51" y="-22.5" width="113.03" height="45" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="0" y="4.9" text-anchor="middle">Merge into it</text></g><g class="pele-node pele-shape-rect" data-id="V" transform="translate(233.02,800.57)"><rect x="-113.7" y="-39" width="227.41" height="78" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-13.1">Keep this version for its project</tspan><tspan x="0" y="4.9">the most complete version</tspan><tspan x="0" y="22.9">becomes the main record</tspan></text></g><g class="pele-node pele-shape-diam" data-id="K" transform="translate(233.02,946.81)"><polygon points="0,-59.24 94.79,0 0,59.24 -94.79,0" fill="#f3f3f3" stroke="#8a8a8a"/><text class="pele-label" x="0" y="4.9" text-anchor="middle">Is the file's key free?</text></g><g class="pele-node pele-shape-rect" data-id="KO" transform="translate(108.76,1124.05)"><rect x="-90.76" y="-22.5" width="181.52" height="45" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="0" y="4.9" text-anchor="middle">Keep the key as written</text></g><g class="pele-node pele-shape-rect" data-id="KS" transform="translate(357.28,1124.05)"><rect x="-117.76" y="-48" width="235.53" height="96" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-22.1">Add a letter, for example</tspan><tspan x="0" y="-4.1">smith2020a</tspan><tspan x="0" y="13.9">and remember the project's own</tspan><tspan x="0" y="31.9">key</tspan></text></g><g class="pele-node pele-shape-rect" data-id="OUT" transform="translate(233.02,1250.05)"><rect x="-112.55" y="-30" width="225.1" height="60" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">Report: added, merged, failed,</tspan><tspan x="0" y="13.9">parse problems, key collisions</tspan></text></g></g></svg>