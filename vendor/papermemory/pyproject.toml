[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papermemory"
version = "0.3.1"
description = "Persistent academic memory for paper understanding and paper writing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
papermemory = "papermemory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["papermemory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
