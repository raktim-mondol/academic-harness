09"/><path class="pele-marker" d="M714.68,804.09L711.32,796.09L718.04,796.09Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_hint_tool_0"><path d="M137.58,954.09L137.58,1037.09"/><path class="pele-marker" d="M137.58,1044.09L134.22,1036.09L140.94,1036.09Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_fields_run_0"><path d="M669.25,996.09C669.25,1018.84 592.83,1018.84 592.83,1041.59L592.83,1047.59"/><path class="pele-marker" d="M592.83,1054.59L589.47,1046.59L596.19,1046.59Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_run_merge_0"><path d="M533.89,1183.59L533.89,1235.09"/><path class="pele-marker" d="M533.89,1242.09L530.53,1234.09L537.25,1234.09Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_merge_rerank_0"><path d="M533.89,1392.09L533.89,1433.09"/><path class="pele-marker" d="M533.89,1440.09L530.53,1432.09L537.25,1432.09Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_rerank_out_0"><path d="M533.89,1590.09C533.89,1607.59 461.03,1607.59 461.03,1625.09L461.03,1631.09"/><path class="pele-marker" d="M461.03,1638.09L457.67,1630.09L464.39,1630.09Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_tool_out_0"><path d="M137.58,1194.09L137.58,1590.09C137.58,1607.59 337.8,1607.59 337.8,1625.09L337.8,1631.09"/><path class="pele-marker" d="M337.8,1638.09L334.44,1630.09L341.16,1630.09Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_explicit_run_0"><path d="M398.54,985.59C398.54,1013.59 474.96,1013.59 474.96,1041.59L474.96,1047.59" stroke-dasharray="3 4"/><path class="pele-marker" d="M474.96,1054.59L471.6,1046.59L478.32,1046.59Z" fill="#1f1f1f" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_key_rules_0"><rect x="679.94" y="312.1" width="69.47" height="36" rx="3" fill="#fff"/><text text-anchor="middle" xml:space="preserve"><tspan x="714.68" y="326">no, or Jev</tspan><tspan x="714.68" y="344">too slow</tspan></text></g><g class="pele-edge-label" data-id="L_key_jev_0"><rect x="219.76" y="319.6" width="29.78" height="21" rx="3" fill="#fff"/><text x="234.65" y="335" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_gate_hint_0"><rect x="36.31" y="702.59" width="202.54" height="72" rx="3" fill="#fff"/><text text-anchor="middle" xml:space="preserve"><tspan x="137.58" y="716.49">No: a retraction, one named</tspan><tspan x="137.58" y="734.49">paper,</tspan><tspan x="137.58" y="752.49">trials, datasets, patents, grants,</tspan><tspan x="137.58" y="770.49">a venue, or news</tspan></text></g><g class="pele-edge-label" data-id="L_gate_fields_0"><rect x="558.96" y="728.09" width="145.72" height="21" rx="3" fill="#fff"/><text x="631.82" y="743.49" text-anchor="middle">Yes: a topic or a claim</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect step" data-id="q" transform="translate(411.42,67.5)"><rect x="-94.92" y="-43.5" width="189.84" height="87" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#ecfdf5;stroke:#059669;"/><text class="pele-label" style="fill:#064e3b;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="bold">1. You ask</tspan><tspan x="0" y="5.6">literature_search: any</tspan><tspan x="0" y="26.6">language</tspan></text></g><g class="pele-node pele-shape-diam decision" data-id="key" transform="translate(411.42,224.3)"><polygon points="0,-65.3 104.48,0 0,65.3 -104.48,0" fill="#f3f3f3" stroke="#8a8a8a" style="fill:#eef2ff;stroke:#6366f1;"/><text class="pele-label" style="fill:#312e81;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">TypeSafe key</tspan><tspan x="0" y="16.1">set and Jev up?</tspan></text></g><g class="pele-node pele-shape-rect plain" data-id="rules" transform="translate(714.68,431.6)"><rect x="-102.9" y="-43.5" width="205.81" height="87" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#f8fafc;stroke:#94a3b8;"/><text class="pele-label" style="fill:#0f172a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">Keyword rules pick the</tspan><tspan x="0" y="5.6">sources</tspan><tspan x="0" y="26.6">(the old way, still works)</tspan></text></g><g class="pele-node pele-shape-rect jevstep" data-id="jev" transform="translate(234.65,431.6)"><rect x="-115.38" y="-54" width="230.75" height="108" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#fff7ed;stroke:#f97316;"/><text class="pele-label" style="fill:#7c2d12;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9" font-weight="bold">2. Jev reads the query</tspan><tspan x="0" y="-4.9">one request, about 0.2 s</tspan><tspan x="0" y="16.1">what is being asked? which</tspan><tspan x="0" y="37.1">field?</tspan></text></g><g class="pele-node pele-shape-diam decision" data-id="gate" transform="translate(234.65,606.84)"><polygon points="0,-73.24 117.19,0 0,73.25 -117.19,0" fill="#f3f3f3" stroke="#8a8a8a" style="fill:#eef2ff;stroke:#6366f1;"/><text class="pele-label" style="fill:#312e81;" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan x="0" y="5.6">3. Is it a topic search?</tspan></text></g><g class="pele-node pele-shape-rect plain" data-id="hint" transform="translate(137.58,900.09)"><rect x="-104.72" y="-54" width="209.44" height="108" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#f8fafc;stroke:#94a3b8;"/><text class="pele-label" style="fill:#0f172a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9" font-weight="bold">Hint mode</tspan><tspan x="0" y="-4.9">search only OpenAlex +</tspan><tspan x="0" y="16.1">Semantic Scholar</tspan><tspan x="0" y="37.1">and name the better tool</tspan></text></g><g class="pele-node pele-shape-rect plain" data-id="fields" transform="translate(669.25,900.09)"><rect x="-114.48" y="-96" width="228.96" height="192" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#f8fafc;stroke:#94a3b8;"/><text class="pele-label" style="fill:#0f172a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-67.9" font-weight="bold">4. Add the right field</tspan><tspan x="0" y="-46.9" font-weight="bold">sources</tspan><tspan x="0" y="-25.9">biology: PubMed, bioRxiv</tspan><tspan x="0" y="-4.9">computing, physics, maths:</tspan><tspan x="0" y="16.1">arXiv</tspan><tspan x="0" y="37.1">particle physics: INSPIRE</tspan><tspan x="0" y="58.1">astronomy: ADS (with</tspan><tspan x="0" y="79.1">token)</tspan></text></g><g class="pele-node pele-shape-rect plain" data-id="tool" transform="translate(137.58,1119.09)"><rect x="-113.58" y="-75" width="227.17" height="150" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#f8fafc;stroke:#94a3b8;"/><text class="pele-label" style="fill:#0f172a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.9">Better tool suggested</tspan><tspan x="0" y="-25.9">trials: clinicaltrials</tspan><tspan x="0" y="-4.9">one paper: paper_get</tspan><tspan x="0" y="16.1">retraction: integrity_check</tspan><tspan x="0" y="37.1">news: Parallel, Exa, Tavily,</tspan><tspan x="0" y="58.1">Brave</tspan></text></g><g class="pele-node pele-shape-rect plain" data-id="run" transform="translate(533.89,1119.09)"><rect x="-110.94" y="-64.5" width="221.87" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#f8fafc;stroke:#94a3b8;"/><text class="pele-label" style="fill:#0f172a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4" font-weight="bold">5. Search all chosen</tspan><tspan x="0" y="-15.4" font-weight="bold">sources at once</tspan><tspan x="0" y="5.6">each has a time limit</tspan><tspan x="0" y="26.6">a source that keeps failing</tspan><tspan x="0" y="47.6">is paused 2 min</tspan></text></g><g class="pele-node pele-shape-rect plain" data-id="merge" transform="translate(533.89,1317.09)"><rect x="-106.03" y="-75" width="212.06" height="150" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#f8fafc;stroke:#94a3b8;"/><text class="pele-label" style="fill:#0f172a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.9" font-weight="bold">6. Merge</tspan><tspan x="0" y="-25.9">same DOI = one paper</tspan><tspan x="0" y="-4.9">(different DOIs are never</tspan><tspan x="0" y="16.1">merged)</tspan><tspan x="0" y="37.1">then rank by agreement</tspan><tspan x="0" y="58.1">across sources</tspan></text></g><g class="pele-node pele-shape-rect jevstep" data-id="rerank" transform="translate(533.89,1515.09)"><rect x="-111.38" y="-75" width="222.75" height="150" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#fff7ed;stroke:#f97316;"/><text class="pele-label" style="fill:#7c2d12;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.9" font-weight="bold">7. Jev reranks the top 30</tspan><tspan x="0" y="-25.9">one request, about 0.4 s</tspan><tspan x="0" y="-4.9">best match for your query</tspan><tspan x="0" y="16.1">goes first</tspan><tspan x="0" y="37.1">(no Jev key or Jev down:</tspan><tspan x="0" y="58.1">keep the fused order)</tspan></text></g><g class="pele-node pele-shape-rect step" data-id="out" transform="translate(399.42,1702.59)"><rect x="-113.62" y="-64.5" width="227.23" height="129" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#ecfdf5;stroke:#059669;"/><text class="pele-label" style="fill:#064e3b;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.4" font-weight="bold">Result</tspan><tspan x="0" y="-15.4">papers, a routing report,</tspan><tspan x="0" y="5.6">and a suggested tool if any</tspan><tspan x="0" y="26.6">(a claim also gets Scite or</tspan><tspan x="0" y="47.6">Consensus)</tspan></text></g><g class="pele-node pele-shape-rect plain" data-id="explicit" transform="translate(398.54,900.09)"><rect x="-116.23" y="-85.5" width="232.46" height="171" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#f8fafc;stroke:#94a3b8;"/><text class="pele-label" style="fill:#0f172a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-57.4">You can also list sources</tspan><tspan x="0" y="-36.4">yourself</tspan><tspan x="0" y="-15.4">Consensus, Scite,</tspan><tspan x="0" y="5.6">Firecrawl, Parallel, Crossref</tspan><tspan x="0" y="26.6">...</tspan><tspan x="0" y="47.6">routing is skipped, merge</tspan><tspan x="0" y="68.6">and rerank still run</tspan></text></g></g></svg>